[project]
name = "teevra-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.8.0",
    "fastapi>=0.143.3",
    "firebase-admin>=7.7.0",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-discoveryengine>=0.20.5",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-pubsub>=2.43.0",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

